<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public API - Modul 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <header class="bg-blue-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold">Daftar Pengguna (Public API)</h1>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10">
        <div id="loading" class="text-center py-10">
            <p class="text-xl text-slate-600">Sedang memuat data...</p>
        </div>

        <div id="error" class="hidden text-center py-10">
            <p class="text-xl text-red-500 font-semibold" id="error-message"></p>
        </div>

        <div id="api-data" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

        <div id="empty-state" class="hidden text-center py-10">
            <p class="text-xl text-slate-600">Tidak ada data yang ditemukan.</p>
        </div>
    </main>

    <footer class="bg-slate-800 text-white text-center py-6 mt-10">
        <p>&copy; 2026 - Codelab Modul 2 Public API</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
